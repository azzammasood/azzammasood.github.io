name: Live portfolio pipeline

# Extracts live data, validates it and publishes status.json to the
# pipeline-data branch, which the site reads at runtime. Keeping the output
# on its own branch means scheduled runs never trigger a site deploy.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous runs
        run: |
          mkdir -p out
          if git fetch --depth 1 origin pipeline-data; then
            git show FETCH_HEAD:status.json > out/status.json || true
          fi

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/pipeline/run.py --out out/status.json

      # The branch holds a single commit with the latest status.json (history
      # lives inside the file), so it never grows.
      - name: Publish status
        working-directory: out
        run: |
          git init -q -b pipeline-data
          git config user.name "portfolio-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -q -m "pipeline run ${{ github.run_id }}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" pipeline-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
