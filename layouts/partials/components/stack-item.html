{{/* One tech-stack chip with its logo from data/tool_icons.yaml, when there is one. */}}
{{ $icon := index site.Data.tool_icons . }}
<span class="experience-stack-item{{ if $icon }} experience-stack-item--icon{{ end }}">
  {{- with $icon }}<img src="{{ . | relURL }}" alt="" loading="lazy" width="16" height="16" />{{ end -}}
  {{ . }}
</span>
